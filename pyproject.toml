[project]
name = "maaya-platform"
version = "0.1.0"
description = "MAAYA — the intelligence behind everything."
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]==0.139.0",
    "pydantic-settings==2.14.2",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pyright[nodejs]==1.1.411",
    "pytest>=8,<11",
    "pytest-cov>=5,<8",
    "ruff==0.15.21",
]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
